name: iOS

# Uebersetzt das Kotlin-Framework fuer iOS und baut die unsignierte Simulator-App.
# Reiner Pruefbau: signiert und ausgeliefert wird ueber Codemagic (codemagic.yaml).
on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "shared/**"
      - "iosApp/**"
      - "gradle/**"
      - "*.gradle.kts"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS-Simulator
    # Abbild nach Xcode-Fassung statt nach Betriebssystem. Vorher lief die
    # Pruefung mit der iOS-18-SDK, waehrend Codemagic mit 27.1 ausliefert - ein
    # Fehler, den es nur unter der neuen SDK gibt, waere hier durchgerutscht.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Womit gebaut wird
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$LATEST"
          echo "::notice title=Xcode::$(xcodebuild -version | head -n 1)"
          SDK="$(xcodebuild -showsdks | grep -o 'iphoneos[0-9.]*' | sort -V | tail -1)"
          echo "::notice title=iOS-SDK::${SDK:-unbekannt}"
          # Der Reihe nach vergleichen, nicht nach Muster: 27.2 ist neuer als
          # 27.1, faellt aber durch jedes auf 27.1 zugeschnittene Muster.
          NEUSTE="$(printf '%s\niphoneos27.1\n' "$SDK" | sort -V | tail -1)"
          [ "$NEUSTE" = "$SDK" ] \
            || echo "::warning::Mit $SDK gebaut. Fuer das ganze Bild auf dem Falt-iPhone braucht es iphoneos27.1 oder neuer."

      - name: Kotlin-Framework fuer den Simulator
        run: ./gradlew -PwithIos :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace
      - name: Xcode-Projekt erzeugen
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate
      - name: Simulator-App bauen (unsigniert)
        run: |
          cd iosApp
          xcodebuild -project Energie.xcodeproj -scheme Energie -configuration Debug \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tail -n 60
          test ${PIPESTATUS[0]} -eq 0
      - name: Was die fertige App anmeldet
        # Ob die App auf grossen Schirmen das ganze Bild bekommt oder in einem kleinen
        # Fenster landet, entscheidet iOS an diesen Eintraegen. Sie stehen nicht in der
        # Quelle, sondern entstehen erst beim Bauen - darum hier nachsehen statt raten.
        run: |
          cd iosApp
          PLIST="$(find build/Build/Products -name Info.plist -path '*Energie.app*' | head -n 1)"
          echo "Info.plist: $PLIST"
          for k in UIDeviceFamily UISupportedInterfaceOrientations UILaunchScreen \
                   UIApplicationSceneManifest UIRequiresFullScreen MinimumOSVersion DTPlatformVersion DTSDKName; do
            V="$(/usr/libexec/PlistBuddy -c "Print :$k" "$PLIST" 2>/dev/null | tr '\n' ' ')"
            # Als Annotation, sonst steht es nur im Rohprotokoll und ist schwer herauszuholen.
            echo "::notice title=$k::${V:-(fehlt)}"
          done
          # Ohne Tablet-Klasse zeigt iOS die App auf grossen Schirmen in einem kleinen Fenster.
          /usr/libexec/PlistBuddy -c "Print :UIDeviceFamily" "$PLIST" | grep -q 2 \
            || { echo "::error::UIDeviceFamily enthaelt keine 2 - die App gilt als reine iPhone-App"; exit 1; }
