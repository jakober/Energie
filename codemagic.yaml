# Codemagic: signierter iOS-Build und Upload zu TestFlight.
# Der Build wird von Hand gestartet (kein Trigger), damit nicht jeder Push Minuten kostet.
# Voraussetzungen im Codemagic-Konto: App-Store-Connect-Integration "energie-asc"
# (Issuer-ID, Key-ID, .p8) - nichts davon liegt im Repository.
workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: energie-asc
    environment:
      xcode: latest
      java: 17
      vars:
        BUNDLE_ID: de.jakober.energie
        XCODE_PROJECT: iosApp/Energie.xcodeproj
        XCODE_SCHEME: Energie
      ios_signing:
        distribution_type: app_store
        bundle_identifier: de.jakober.energie
    scripts:
      - name: Xcode-Projekt erzeugen
        script: |
          brew install xcodegen
          cd iosApp && xcodegen generate
      - name: Signierprofile eintragen
        script: |
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Build-Nummer setzen
        script: |
          # Codemagics fortlaufende Build-Nummer als CFBundleVersion, damit TestFlight jede Version annimmt.
          cd iosApp && agvtool new-version -all "$BUILD_NUMBER"
      - name: Kotlin-Framework und IPA bauen
        script: |
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        # Die App bleibt fuer immer intern. Interne Tester bekommen jeden verarbeiteten
        # Build ohnehin (automatische Verteilung der Gruppe); die Anmeldung zur externen
        # Beta-Pruefung verlangt dagegen Angaben, die es hier nie geben wird, und liesse
        # jeden Build rot enden, obwohl er einwandfrei hochgeladen wurde.
        submit_to_testflight: false
      email:
        recipients:
          - mat.jakober@gmail.com
        notify:
          success: true
          failure: true

  ios-check:
    name: iOS Simulator-Pruefbau
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      java: 17
    scripts:
      - name: Framework fuer den Simulator
        script: ./gradlew -PwithIos :shared:linkDebugFrameworkIosSimulatorArm64
      - name: Xcode-Projekt erzeugen und bauen
        script: |
          brew install xcodegen
          cd iosApp && xcodegen generate
          xcodebuild -project Energie.xcodeproj -scheme Energie -configuration Debug -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build
