# Startet den Codemagic-Build "ios-testflight" nur, wenn die Beschreibung des
# Commits [ios] enthaelt. So kommen nur ausgewaehlte Staende auf das iPhone,
# ohne dass jemand von Hand einen Build startet.
#
# Noetige Geheimnisse (Repository -> Settings -> Secrets and variables -> Actions):
#   CODEMAGIC_API_TOKEN  = Codemagic -> Teams/User settings -> Integrations -> Codemagic API
#   CODEMAGIC_APP_ID     = die Kennung der App in der Codemagic-Adresse (24 Zeichen)
name: iOS an TestFlight

on:
  push:
    branches: [main]
  # Von Hand ausloesbar, damit ein Stand erst gruen sein kann und dann aufs iPhone geht.
  # Ueber [ios] geht beides gleichzeitig los, und ein Fehler faellt erst in Codemagic auf.
  workflow_dispatch:

jobs:
  start:
    # Nur der Titel zaehlt, nicht die ganze Beschreibung: Wer im Fliesstext ueber das
    # Stichwort schreibt, loest sonst ungewollt einen Build aus. Genau das ist passiert.
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '[ios]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Codemagic-Build starten
        env:
          TOKEN: ${{ secrets.CODEMAGIC_API_TOKEN }}
          APP_ID: ${{ secrets.CODEMAGIC_APP_ID }}
          # Ueber die Umgebung, nicht in den Befehl hinein: Eine Commit-Beschreibung ist
          # Text von aussen und hat in einer Kommandozeile nichts verloren.
          GRUND: ${{ github.event_name }}
          NACHRICHT: ${{ github.event.head_commit.message }}
          STICHWORT: "[ios]"
        run: |
          # Zweite Sperre, mit derselben Regel: nur die erste Zeile, und nur ihr Anfang.
          # Das Stichwort steht in Anfuehrungszeichen, sonst liest die Schale die eckigen
          # Klammern als Auswahl einzelner Zeichen statt als den Text, der sie sind.
          if [ "$GRUND" != "workflow_dispatch" ]; then
            TITEL="$(printf '%s' "$NACHRICHT" | head -n 1)"
            case "$TITEL" in
              "$STICHWORT"*) ;;
              *) echo "Kein Stichwort am Titelanfang - kein Build."; exit 0 ;;
            esac
          fi
          if [ -z "$TOKEN" ] || [ -z "$APP_ID" ]; then
            echo "Kein Codemagic-Zugang hinterlegt. Build bitte von Hand starten."
            exit 0
          fi
          code=$(curl -sS -o antwort.json -w "%{http_code}" -X POST https://api.codemagic.io/builds \
            -H "x-auth-token: $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"appId\":\"$APP_ID\",\"workflowId\":\"ios-testflight\",\"branch\":\"${GITHUB_REF_NAME}\"}")
          echo "Antwort $code"
          cat antwort.json
          test "$code" -lt 300
